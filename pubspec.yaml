name: nauvim_flutter
description: A Flutter desktop GUI for Neovim, with a Rust Nauvim engine.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  material_ui: ^1.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1
flutter:
  uses-material-design: true
